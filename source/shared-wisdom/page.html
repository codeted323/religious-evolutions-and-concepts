<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Wisdom</title>
<style>
:root{
  --bg:#fbfaf8; --pane:#f4f2ee; --ink:#2b2a28; --mut:#77736c; --line:#e4e0d9; --link:#4a4843; --acc:#2b2a28;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1c1b; --pane:#222220; --ink:#dedbd5; --mut:#97928a; --line:#34332f; --link:#cfcbc4; --acc:#f1eee8; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
.layout{display:flex;height:100vh;height:100dvh}
#toc{width:300px;flex:0 0 300px;overflow-y:auto;background:var(--pane);border-right:1px solid var(--line);padding:22px 14px 40px 18px;font-size:13.5px;line-height:1.35}
#toc .back{margin:0 0 14px 4px;font-size:12.5px}#toc .back a{color:var(--mut)}
#toc .ttl{font-family:var(--serif);font-size:17px;margin:0 0 14px 4px;color:var(--ink)}
#toc ul{list-style:none;margin:0;padding:0}
#toc li a{display:block;padding:3px 6px;border-radius:4px;color:var(--mut)}
#toc li a:hover{text-decoration:none;color:var(--ink)}
#toc li.l0{margin-top:16px}
#toc li.l0 a{color:var(--ink);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
#toc li.l1 a{color:var(--ink);margin-top:4px}
#toc li.l2 a{padding-left:18px}
#toc a.active{font-weight:700;color:var(--acc)}
#content{flex:1;overflow-y:auto;scroll-behavior:auto}
.inner{max-width:760px;margin:0 auto;padding:40px 36px 30vh}
section{scroll-margin-top:16px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;margin:0 0 8px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 10px}
h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 4px}
.lede{font-family:var(--serif);font-size:19px;color:var(--mut);margin-top:0}
section.top{margin-bottom:44px}
section.part{margin:70px 0 10px;padding-top:28px;border-top:1px solid var(--line)}
.parth{font-size:30px}
section.area{margin:46px 0 8px}
section.area h2{font-size:15px;font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
section.theme{margin:18px 0 40px;padding-bottom:6px}
.meta{font-size:13px;color:var(--mut);margin:0 0 8px}
.summ{margin:0 0 12px}
.note{font-size:14.5px;color:var(--mut);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 14px}
.trad{margin:14px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.tname{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.entry{margin:0 0 10px}
.q{font-family:var(--serif);font-size:17px;line-height:1.5;margin:0}
.q.para{font-style:italic}
.ed{color:var(--mut)}
.ptag{font:11px var(--sans);color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-style:normal;margin-left:4px}
.cite{font-size:12.5px;color:var(--mut);margin:2px 0 0}
.cite a{color:var(--mut);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.small{font-size:13px;color:var(--mut)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.glance{border-collapse:collapse;font-size:13px;width:100%}
.glance th,.glance td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center;color:var(--mut)}
.glance thead th{vertical-align:bottom;height:120px;padding-bottom:8px}
.glance thead th span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:400}
.glance tbody th{text-align:left;font-weight:400;white-space:nowrap;padding-right:12px}
.glance tbody th a{color:var(--ink)}
.glance tr.area td{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding-top:12px;color:var(--mut)}
#sources ul{margin:4px 0 16px;padding-left:18px;font-size:14px}
#tocbtn{display:none}.mbar{display:none}
@media (max-width:760px){
  #toc{position:fixed;inset:0 auto 0 0;width:86vw;max-width:340px;z-index:5;transform:translateX(-100%);transition:transform .18s ease;box-shadow:none}
  #toc.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.25)}
  .mbar{display:flex;position:fixed;top:0;left:0;right:0;height:46px;align-items:center;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:4}
  .mbar span{font-family:var(--serif);font-size:15px;color:var(--mut);margin-left:12px}
  #tocbtn{display:block;font:13px var(--sans);color:var(--ink);background:var(--pane);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
  .layout{padding-top:46px}
  .inner{padding:22px 18px 40vh}
  .glance tbody th{white-space:normal;min-width:150px}
  .glance th,.glance td{padding:4px 4px}
  h1{font-size:28px}
  .q{font-size:16.5px}
}
</style>
</head>
<body>
<div class="mbar"><button id="tocbtn" aria-controls="toc" aria-expanded="false">Contents</button><span>Shared Wisdom</span></div>
<div class="layout">
  <nav id="toc" aria-label="Contents"><p class="back"><a href="index.html">← The family tree of belief</a></p><p class="ttl">Shared Wisdom</p><!--TOC--></nav>
  <main id="content" tabindex="-1"><div class="inner"><!--BODY--></div></main>
</div>
<script>
(function(){
  const content=document.getElementById('content'), toc=document.getElementById('toc'), btn=document.getElementById('tocbtn');
  const links=[...toc.querySelectorAll('a[data-t]')];
  const map=new Map(links.map(a=>[a.dataset.t,a]));
  const secs=links.map(a=>document.getElementById(a.dataset.t)).filter(Boolean);
  let current=null, lock=0;
  function setActive(id){
    if(id===current)return; current=id;
    links.forEach(a=>a.classList.toggle('active',a.dataset.t===id));
    const a=map.get(id);
    if(a){const r=a.getBoundingClientRect(), tr=toc.getBoundingClientRect();
      if(r.top<tr.top+40||r.bottom>tr.bottom-20) toc.scrollTop+= (r.top-tr.top) - tr.height/3;}
  }
  function spy(){
    if(Date.now()<lock)return;
    const top=content.getBoundingClientRect().top, y=top+content.clientHeight*0.25;
    let id=secs[0].id;
    for(const s of secs){ if(s.getBoundingClientRect().top<=y) id=s.id; else break; }
    if(content.scrollTop+content.clientHeight>=content.scrollHeight-2) id=secs[secs.length-1].id;
    setActive(id);
  }
  let raf=0; content.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;spy()})},{passive:true});
  function go(id){
    const el=document.getElementById(id); if(!el)return;
    lock=Date.now()+120; setActive(id);
    content.scrollTop += el.getBoundingClientRect().top - content.getBoundingClientRect().top - 12;
    history.replaceState(null,'','#'+id);
  }
  document.addEventListener('click',e=>{
    const a=e.target.closest('a[data-t]'); if(!a)return;
    e.preventDefault(); go(a.dataset.t);
    if(toc.classList.contains('open')){toc.classList.remove('open');btn.setAttribute('aria-expanded','false')}
  });
  btn.addEventListener('click',()=>{const o=toc.classList.toggle('open');btn.setAttribute('aria-expanded',String(o))});
  document.addEventListener('click',e=>{ if(toc.classList.contains('open')&&!toc.contains(e.target)&&e.target!==btn){toc.classList.remove('open');btn.setAttribute('aria-expanded','false')} },true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&toc.classList.contains('open')){toc.classList.remove('open');btn.setAttribute('aria-expanded','false');btn.focus()}});
  const h=decodeURIComponent(location.hash.slice(1)); if(h&&document.getElementById(h)) go(h); else spy();
})();
</script>
</body>
</html>
